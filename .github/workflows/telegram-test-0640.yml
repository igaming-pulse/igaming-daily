name: Telegram 測試推播（公司帳號併行版）

# 台北 06:40 = UTC 22:40（前一天）。比舊環境那則晚 10 分鐘，兩則不會擠在一起。
#
# ⚠️ 為什麼這個檔要放在 main：GitHub 規定 cron 排程只有「預設分支」上的 workflow
#    才會觸發。但它 checkout 的是 test-publish —— 腳本與當天的 pending 檔在那個分支。
#
# 切換日要做的事：刪掉這個檔，改用 test-publish 上的 telegram-0630.yml。
on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印出不實際發送（true / false）'
        required: false
        default: 'true'

concurrency:
  group: telegram-test
  cancel-in-progress: false

jobs:
  push-telegram-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-publish
      - name: 發送（測試）Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:            ${{ github.event.inputs.dry_run }}
          MSG_PREFIX:         '🧪【測試】公司帳號併行版 · nathan.kao@bituslabs.com'
          REPORT_URL_SUFFIX:  '-test'
        run: python3 scripts/send_telegram.py
