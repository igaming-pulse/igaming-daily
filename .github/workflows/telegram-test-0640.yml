name: Telegram 測試推播（公司帳號併行版）

# 台北 06:40 = UTC 22:40（前一天）。比舊環境那則晚 10 分鐘，兩則不會擠在一起。
#
# ⚠️ 為什麼這個檔要放在 main：GitHub 規定 cron 排程只有「預設分支」上的 workflow
#    才會觸發。但它 checkout 的是 test-publish —— 腳本與當天的 pending 檔在那個分支。
#
# 切換日要做的事：刪掉這個檔，改用 test-publish 上的 telegram-0630.yml。
# 執行名稱帶上種類：守門判斷「今天日報已推播」時，只算 url_suffix=-test 的正常日報（不算警報、特別版）
run-name: "Telegram ${{ github.event_name == 'schedule' && '排程' || (inputs.alert == 'true' && '警報' || format('{0} {1}', inputs.report_date, inputs.url_suffix)) }}"

on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印出不實際發送（true / false）'
        required: false
        default: 'true'
      url_suffix:
        description: '按鈕指向的檔名後綴（-test ＝ 併行版；-v2 ＝ 第二版重跑）'
        required: false
        default: '-test'
      msg_prefix:
        description: '訊息第一行標記（留空＝預設的【測試】標記）'
        required: false
        default: ''
      report_date:
        description: '要發哪一天（YYYY-MM-DD，留空＝今天）'
        required: false
        default: ''
      pending_path:
        description: '預存訊息檔（留空＝state/pending_telegram.txt）'
        required: false
        default: ''
      alert:
        description: '即時警報模式（true＝直接送 pending_path 內容，不經守門員）'
        required: false
        default: 'false'

concurrency:
  group: telegram-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  push-telegram-test:
    runs-on: ubuntu-latest
    steps:
      # 2026-10-05：13' v 跑完若已過 06:30，scripts/notify_telegram.sh 會直接手動觸發本 workflow。
      # 排程那次若發現「今天（台北）已有成功的手動發送」就跳過，避免同一份日報送兩次。
      - name: 今天已手動發送過就跳過（只對排程）
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          tpe = timezone(timedelta(hours=8))
          today = datetime.now(tpe).date()
          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/"
                 "telegram-test-0640.yml/runs?event=workflow_dispatch&status=success&per_page=20")
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                                                     "Accept": "application/vnd.github+json"})
          runs = json.load(urllib.request.urlopen(req)).get("workflow_runs", [])
          sent = [r for r in runs if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(tpe).date() == today
                  and "-test" in (r.get("display_title") or "") and "警報" not in (r.get("display_title") or "")]
          skip = "true" if sent else "false"
          print(f"今天（{today}）已成功手動發送 {len(sent)} 次 → skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={skip}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: test-publish
      - name: 發送（測試）Telegram
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:            ${{ github.event.inputs.dry_run }}
          MSG_PREFIX:         ${{ github.event.inputs.msg_prefix || '🧪【測試】公司帳號併行版 · nathan.kao@bituslabs.com' }}
          REPORT_URL_SUFFIX:  ${{ github.event.inputs.url_suffix || '-test' }}
          REPORT_DATE:        ${{ github.event.inputs.report_date }}
          PENDING_PATH:       ${{ github.event.inputs.pending_path }}
          ALERT:              ${{ github.event.inputs.alert }}
        run: python3 scripts/send_telegram.py
