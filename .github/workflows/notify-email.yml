name: 日報 Email 通知

# 當日報 push 上來時寄出 Email（零 token，不呼叫任何 AI）
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
  workflow_dispatch:          # 也可以手動觸發，方便測試

concurrency:
  group: notify-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 寄出日報 Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python3 scripts/send_email.py
